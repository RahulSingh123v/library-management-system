{% extends 'base.html' %}
{% block title %}404 — Page Not Found · LibraryOS{% endblock %}
{% block page_title %}Not Found{% endblock %}
{% block content %}
<div class="empty-state" style="padding:80px 24px;">
  <div style="font-size:72px; font-weight:800; color:var(--accent); letter-spacing:-4px; line-height:1; margin-bottom:12px;">404</div>
  <div class="empty-state-icon" style="font-size:44px; margin-bottom:16px;"><i class="fas fa-compass-drafting"></i></div>
  <h4 style="font-size:20px;">Page Not Found</h4>
  <p style="margin-bottom:24px;">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{% url 'library:home' %}" class="btn-lms btn-accent" id="go-home-404">
    <i class="fas fa-house"></i> Go Home
  </a>
</div>
{% endblock %}
